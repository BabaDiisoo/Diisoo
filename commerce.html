const $ = (id) => document.getElementById(id);
const attente = (ms) => new Promise((r) => setTimeout(r, ms));

const journal = [];
function enTexte(args) {
  return args.map((a) => {
    if (typeof a === "string") return a;
    if (a && a.message) return a.message;
    try { return JSON.stringify(a); } catch (e) { return String(a); }
  }).join(" ");
}
function noter(niveau, args) {
  journal.push(new Date().toISOString().slice(11, 19) + " " + niveau + " " + enTexte(args));
  if (journal.length > 60) journal.shift();
  const el = $("journalTexte");
  if (el) el.textContent = journal.slice(-16).join("\n");
}
const LOG = (...a) => { console.log("[diisoo]", ...a); noter("info", a); };
const ERR = (...a) => { console.error("[diisoo]", ...a); noter("ERREUR", a); };
const diag = (t) => { $("diag").textContent = t; };

function avecDelai(p, ms, nom) {
  let t;
  const limite = new Promise((_, rej) => { t = setTimeout(() => rej(new Error("delai depasse : " + nom)), ms); });
  return Promise.race([Promise.resolve(p), limite]).finally(() => clearTimeout(t));
}

let promesseIDB = null;
function ouvrirIDB() {
  if (!("indexedDB" in window)) return Promise.resolve(null);
  if (!promesseIDB) {
    promesseIDB = new Promise((resolve) => {
      try {
        const rq = indexedDB.open("DiisooStore", 1);
        rq.onupgradeneeded = () => {
          if (!rq.result.objectStoreNames.contains("audio_cache")) rq.result.createObjectStore("audio_cache", { keyPath: "hash" });
        };
        rq.onsuccess = () => resolve(rq.result);
        rq.onerror = () => resolve(null);
        rq.onblocked = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  }
  return promesseIDB;
}
async function idbGet(hash) {
  const base = await ouvrirIDB();
  if (!base) return null;
  return new Promise((resolve) => {
    try {
      const rq = base.transaction("audio_cache", "readonly").objectStore("audio_cache").get(hash);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
async function idbPut(hash, blob) {
  const base = await ouvrirIDB();
  if (!base) return;
  await new Promise((resolve) => {
    try {
      const tx = base.transaction("audio_cache", "readwrite");
      tx.objectStore("audio_cache").put({ hash, blob, mime: blob.type, taille: blob.size, date: Date.now() });
      tx.oncomplete = resolve;
      tx.onerror = resolve;
      tx.onabort = resolve;
    } catch (e) { resolve(); }
  });
}
async function hacher(texte) {
  if (!window.crypto || !crypto.subtle) return null;
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

const lecteur = new Audio();
lecteur.preload = "auto";
const memoire = new Map();
let clientP = null;
let enCours = false;

function obtenirClient() {
  if (!clientP) {
    clientP = (async () => {
      LOG("import du client Gradio");
      const m = await avecDelai(import(CLIENT_URL), 30000, "import du client");
      LOG("client importe, connexion au Space", SPACE);
      let dernier = "";
      const c = await avecDelai(m.Client.connect(SPACE, {
        events: ["data", "status"],
        status_callback: (s) => {
          const t = (s && (s.message || s.status)) || "";
          if (t !== dernier) { dernier = t; LOG("etat du Space :", t); diag("Voix : " + t); }
        }
      }), 120000, "connexion au Space");
      LOG("Space connecte");
      return c;
    })().catch((e) => { clientP = null; ERR("connexion impossible :", e); throw e; });
  }
  return clientP;
}

async function synthese(texte) {
  const client = await obtenirClient();
  LOG("envoi de la phrase a Oolel");
  const job = client.submit(ENDPOINT, {
    text_input: texte,
    exaggeration_input: 0.3,
    temperature_input: 0.2,
    seed_num_input: 0,
    cfgw_input: 0.5
  });
  let sortie = null;
  let vu = "";
  for await (const ev of job) {
    if (ev.type === "status") {
      const marque = ev.stage + ":" + (ev.position !== undefined ? ev.position : "") + ":" + (ev.message || "");
      if (marque !== vu) {
        vu = marque;
        LOG("statut", ev.stage, ev.position !== undefined ? "file " + ev.position : "", ev.message || "");
        if (ev.stage === "pending" && ev.position !== undefined) diag("Voix : file d'attente, position " + ev.position);
        if (ev.stage === "generating") diag("Voix : génération en cours");
      }
      if (ev.stage === "error") throw new Error(ev.message || "erreur renvoyee par le Space");
    } else if (ev.type === "data") {
      sortie = ev.data;
    }
  }
  if (!Array.isArray(sortie) || !sortie[0] || typeof sortie[0].url !== "string" || !/^https:\/\//i.test(sortie[0].url)) {
    ERR("reponse inattendue", sortie);
    throw new Error("reponse du Space invalide");
  }
  LOG("audio genere", sortie[0].url);
  return sortie[0].url;
}

async function recupererAudio(url) {
  try {
    const rep = await avecDelai(fetch(url), 30000, "telechargement");
    if (!rep.ok) throw new Error("HTTP " + rep.status);
    const blob = await rep.blob();
    if (!blob.size) throw new Error("audio vide");
    LOG("audio telecharge", blob.size, "octets", blob.type);
    return { blob };
  } catch (e) {
    ERR("telechargement impossible, lecture directe de l'adresse :", e);
    return { url };
  }
}

function amorcer() {
  try {
    lecteur.src = SILENCE;
    const p = lecteur.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { return; }
}

function jouer(source) {
  return new Promise((resolve, reject) => {
    let adresse = source.url;
    let objet = null;
    if (source.blob) { objet = URL.createObjectURL(source.blob); adresse = objet; }
    const fin = (erreur) => {
      lecteur.onended = null;
      lecteur.onerror = null;
      if (objet) setTimeout(() => URL.revokeObjectURL(objet), 15000);
      if (erreur) reject(erreur); else resolve();
    };
    lecteur.onended = () => { LOG("lecture terminee"); fin(); };
    lecteur.onerror = () => {
      const c = lecteur.error;
      fin(new Error("lecture impossible" + (c ? " (code " + c.code + ")" : "")));
    };
    lecteur.src = adresse;
    const p = lecteur.play();
    if (p && p.catch) p.catch((e) => fin(new Error("lecture refusee : " + e.message)));
  });
}

async function parler(texte, bouton) {
  if (enCours) { LOG("une lecture est deja en cours, demande ignoree"); return; }
  enCours = true;
  amorcer();
  const ancien = bouton.textContent;
  bouton.textContent = "⏳";
  bouton.disabled = true;
  try {
    LOG("demande de lecture,", texte.length, "caracteres");
    let source = memoire.get(texte) || null;
    if (!source) {
      const h = await hacher(texte);
      if (h) {
        const local = await idbGet(h);
        if (local && local.blob && local.blob.size) { LOG("audio trouve dans le cache de l'appareil"); source = { blob: local.blob }; }
      }
      if (!source) {
        diag("Voix : préparation (jusqu'à une minute la première fois)");
        const url = await avecDelai(synthese(texte), 180000, "generation de la voix");
        source = await recupererAudio(url);
        if (source.blob && h) idbPut(h, source.blob);
      }
      memoire.set(texte, source);
    }
    await jouer(source);
    diag("Voix : prête");
  } catch (e) {
    ERR("echec de la lecture :", e);
    diag("Voix indisponible : " + (e && e.message ? e.message : "erreur inconnue"));
  } finally {
    enCours = false;
    bouton.textContent = ancien;
    bouton.disabled = false;
  }
}

let Diisoo = null;
async function chargerDiisoo() {
  try {
    await import("./diisoo-pro.js");
    Diisoo = window.Diisoo || null;
    LOG(Diisoo ? "module de paiement charge" : "module de paiement absent");
  } catch (e) {
    ERR("module de paiement indisponible :", e);
  }
}
async function attendreSession() {
  if (!Diisoo) return;
  for (let i = 0; i < 16; i++) {
    if (Diisoo.etat().connecte) break;
    await attente(250);
  }
  if (Diisoo.etat().connecte) await Diisoo.rafraichirProfil();
}
const estPremium = () => !!(Diisoo && Diisoo.etat().premium);
const estConnecte = () => !!(Diisoo && Diisoo.etat().connecte);

async function lignesDuModule(m) {
  if (Diisoo) {
    try {
      const data = await Diisoo.themes.charger(m.id);
      if (Array.isArray(data) && data.length) return data.map((p) => [p.wolof, p.francais || "", p.anglais || ""]);
    } catch (e) { ERR("themes indisponibles :", e); }
  }
  return m.lignes;
}

function creerLigne(l, i, premium) {
  const ligne = document.createElement("div");
  ligne.className = "ligne";
  const txt = document.createElement("div");
  txt.className = "txt";
  if (!premium && i >= GRATUIT) {
    ligne.classList.add("verrou");
    const fr = document.createElement("div");
    fr.className = "wo";
    fr.textContent = l[1] || l[0];
    txt.appendChild(fr);
    const cad = document.createElement("span");
    cad.className = "cadenas";
    cad.textContent = "🔒 Premium";
    ligne.append(txt, cad);
    return ligne;
  }
  const wo = document.createElement("div");
  wo.className = "wo";
  wo.textContent = l[0];
  txt.appendChild(wo);
  if (l[1]) { const fr = document.createElement("div"); fr.className = "fr"; fr.textContent = l[1]; txt.appendChild(fr); }
  if (l[2]) { const en = document.createElement("div"); en.className = "en"; en.textContent = l[2]; txt.appendChild(en); }
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ecoute";
  b.textContent = "🔊";
  b.setAttribute("aria-label", "Écouter en wolof");
  b.addEventListener("click", () => parler(l[0], b));
  ligne.append(txt, b);
  return ligne;
}

let courant = MODULES[0].id;

function rendreOnglets() {
  const nav = $("onglets");
  nav.textContent = "";
  MODULES.forEach((m) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "puce" + (m.id === courant ? " actif" : "");
    b.textContent = m.titre;
    b.addEventListener("click", () => { courant = m.id; afficher(); });
    nav.appendChild(b);
  });
}

function majOffre() {
  const premium = estPremium();
  const badge = $("badge");
  badge.textContent = premium ? "Premium" : "Gratuit";
  badge.className = premium ? "premium" : "";
  $("offre").classList.toggle("cache", premium);
  $("btnConnexion").classList.toggle("cache", !Diisoo || estConnecte());
  $("btnActualiser").classList.toggle("cache", !Diisoo || !estConnecte());
}

async function afficher() {
  const m = MODULES.find((x) => x.id === courant);
  rendreOnglets();
  $("sous").textContent = m.sous;
  const liste = $("liste");
  const lignes = await lignesDuModule(m);
  if (m.id !== courant) return;
  const premium = estPremium();
  liste.textContent = "";
  lignes.forEach((l, i) => liste.appendChild(creerLigne(l, i, premium)));
  majOffre();
}

$("btnAcheter").addEventListener("click", async () => {
  if (!Diisoo) { diag("Paiement indisponible pour le moment."); ERR("achat impossible : module de paiement non charge"); return; }
  LOG("demarrage de l'achat Premium");
  await Diisoo.acheter("premium");
  majOffre();
});

$("btnConnexion").addEventListener("click", async () => {
  if (!Diisoo) return;
  await Diisoo.connexion();
  await attendreSession();
  afficher();
});

$("btnActualiser").addEventListener("click", async () => {
  if (!Diisoo) return;
  await Diisoo.rafraichirProfil();
  LOG("profil actualise, premium =", estPremium());
  if (!estPremium()) diag("Paiement pas encore confirmé. Réessaie dans quelques minutes.");
  afficher();
});

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !Diisoo || !estConnecte() || estPremium()) return;
  await Diisoo.rafraichirProfil();
  if (estPremium()) afficher();
});

window.addEventListener("error", (e) => ERR("erreur de page :", e.message));
window.addEventListener("unhandledrejection", (e) => ERR("promesse rejetee :", e.reason));

(async function demarrer() {
  await afficher();
  setTimeout(() => { obtenirClient().catch(() => {}); }, 2000);
  await chargerDiisoo();
  await attendreSession();
  await afficher();
})();
</script>
</body>
</html>
